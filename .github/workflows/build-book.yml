name: Build and Publish Book

on:
  push:
    branches: [main, book-agent-foundation]
    paths:
      - 'BOOK/**'
      - 'tools/**'
      - '.github/workflows/build-book.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'BOOK/**'
      - 'tools/**'
      - '.github/workflows/build-book.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice fonts-noto-core fonts-noto-extra librsvg2-bin poppler-utils
          python -m pip install --upgrade pip
          python -m pip install python-docx

      - name: Build Markdown and reference template
        run: python tools/build_book.py

      - name: Render DOCX and PDF chapter files
        run: python tools/render_book.py

      - name: Validate publication outputs
        run: python tools/validate_publication.py

      - name: Publish generated chapter files to repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PUBLISH/CHAPTERS
          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git commit -m "Publish generated chapter DOCX and PDF files"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book-publications
          path: PUBLISH/CHAPTERS/
