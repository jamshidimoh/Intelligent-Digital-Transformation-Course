name: Build and Publish Book

on:
  push:
    branches: [main, book-agent-foundation]
    paths:
      - 'BOOK/**'
      - 'tools/**'
      - '.github/workflows/build-book.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'BOOK/**'
      - 'tools/**'
      - '.github/workflows/build-book.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-book-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Synchronize branch before generation
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          branch="${{ github.ref_name }}"
          git fetch origin "$branch"
          git reset --hard "origin/$branch"
          git clean -fdx

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice fonts-noto-core fonts-noto-extra librsvg2-bin poppler-utils
          python -m pip install --upgrade pip
          python -m pip install python-docx

      - name: Build Markdown and reference template
        run: python tools/build_book.py

      - name: Render DOCX and PDF chapter files
        run: python tools/render_book.py

      - name: Generate publication QA report
        run: python tools/validate_publication.py

      - name: Enforce publication QA gate
        run: |
          test -f PUBLISH/QA/01-foundations-qa.md
          if grep -q '^FAIL$' PUBLISH/QA/01-foundations-qa.md; then
            echo 'Publication QA gate failed.'
            cat PUBLISH/QA/01-foundations-qa.md
            exit 1
          fi
          echo 'Publication QA gate passed.'

      - name: Publish generated outputs atomically
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PUBLISH/QA PUBLISH/CHAPTERS
          if git diff --cached --quiet; then
            echo "No generated publication changes."
            exit 0
          fi
          git commit -m "Publish generated chapter outputs and QA report"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload publication and QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-publications-and-qa
          path: |
            PUBLISH/CHAPTERS/
            PUBLISH/QA/
          if-no-files-found: warn
